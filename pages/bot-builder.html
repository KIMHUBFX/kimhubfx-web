<div id="botBuilder" class="bot-builder-panel">
  <h2>Bot Builder</h2>

  <!-- Symbol & Contract Type -->
  <div class="bot-settings">
    <div class="bot-card">
      <label>Symbol</label>
      <select id="symbol">
        <option value="R_100">R_100</option>
        <option value="R_50">R_50</option>
        <option value="R_25">R_25</option>
      </select>
    </div>

    <div class="bot-card">
      <label>Contract Type</label>
      <div class="contract-toggle">
        <button class="toggle-btn active" data-type="normal">Normal</button>
        <button class="toggle-btn" data-type="inshott">Inshott</button>
      </div>
    </div>

    <div class="bot-card">
      <label>Volatility</label>
      <select id="volatility">
        <option value="1s">1s</option>
        <option value="5s">5s</option>
        <option value="10s">10s</option>
        <option value="15s">15s</option>
        <option value="30s">30s</option>
        <option value="1m">1m</option>
        <option value="5m">5m</option>
      </select>
    </div>
  </div>

  <!-- Trade Parameters Panel -->
  <div class="bot-parameters">
    <div class="bot-card small">
      <label>Duration (s)</label>
      <input type="number" id="duration" value="10" min="1">
    </div>
    <div class="bot-card small">
      <label>Stake</label>
      <input type="number" id="stake" value="1" min="0.1" step="0.1">
    </div>
    <div class="bot-card small">
      <label>Stop Loss</label>
      <input type="number" id="stopLoss" value="0" min="0">
    </div>
    <div class="bot-card small">
      <label>Take Profit</label>
      <input type="number" id="takeProfit" value="0" min="0">
    </div>
  </div>

  <!-- Buttons -->
  <div class="bot-buttons">
    <button class="start" id="startBot">Start Bot</button>
    <button class="stop" id="stopBot">Stop Bot</button>
  </div>

  <!-- Bot Log -->
  <div id="botLog" class="bot-log"></div>

  <!-- Bot Chart -->
  <div class="bot-chart-card">
    <canvas id="botChart"></canvas>
  </div>
</div>
