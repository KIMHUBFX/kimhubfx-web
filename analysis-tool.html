<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KIMHUBFX Analysis Tool</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#121212; color:white; }
    .content{padding:20px;}
    #tickChart{width:100%; height:400px; background:#1e1e1e; margin-top:20px;}
    #tickLog{max-height:200px; overflow-y:auto; border:1px solid #444; padding:10px; margin-top:10px; font-size:0.9em; background:#222;}
    select {padding:6px 12px; margin-top:10px; background:#222; color:white; border:1px solid #555; border-radius:4px;}
  </style>
</head>
<body>
  <div class="content">
    <h1>Analysis Tool</h1>
    <p>Select a Volatility Index:</p>
    <select id="symbol">
      <option value="R_100">R_100</option>
      <option value="R_25">R_25</option>
      <option value="R_50">R_50</option>
      <option value="R_75">R_75</option>
      <option value="R_10">R_10</option>
    </select>

    <canvas id="tickChart"></canvas>

    <h3>Tick Log</h3>
    <div id="tickLog"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="analysis-tool.js"></script>
</body>
</html>
